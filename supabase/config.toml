# Supabase CLI configuration.
#
# Deliberately minimal: the CLI supplies defaults for everything omitted, and
# unknown keys from a mismatched CLI version cause hard errors. If you need to
# customise local ports or auth settings, run `npx supabase init --force` to
# regenerate a full file for your installed CLI version, then re-apply the
# project_id below.
#
# This file contains no secrets. Project credentials live in .env.local.

project_id = "ezike-oba"

[db]
# Must match the Postgres major version of the linked project, or `db reset`
# and `db push` can disagree with production.
major_version = 15

[auth]
# Overridden per environment. For production these are set in the Supabase
# dashboard under Authentication > URL Configuration.
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]

[auth.email]
# Email confirmation is OFF by product decision: members sign in and reach the
# community immediately, with a welcome page instead of an inbox round trip.
#
# The trade-off, recorded deliberately: an address is no longer proven at
# sign-up, so someone can register with an email they do not control. Google
# and Apple sign-in do not have this gap, because the provider has already
# verified the address -- which is part of why they are offered first.
enable_confirmations = false
